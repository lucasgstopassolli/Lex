<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" spellcheck="false">

<head>
    <!-- Setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <!-- Styles and Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/default.css">
</head>

<body class="margin-0 d-flex flex-column">

    <!-- Nav Tabs -->
    <ul class="nav nav-pills d-flex flex-row gap-0 p-1 mb-1 flex-nowrap nav-bar mainTab" id="pills-tab" role="tablist">

        <!-- Home Button -->
        <li class="nav-item w-100" role="presentation">
            <button
                class="nav-link p-2 rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100 h-100"
                style="font-size: 0.9rem;" id="but-initial-tab" data-bs-toggle="pill" data-bs-target="#initial-tab"
                type="button" role="tab" aria-controls="initial-tab" aria-selected="true">
                <img draggable="false" src="img/svg/home.svg" alt="Início" width="16"
                    style="margin-left: -0.5rem; margin-right: -0.1rem">
                <span style="line-height: normal;">Início</span>
            </button>
        </li>
        <!-- Wordpress Button -->
        <li class="nav-item w-100" role="presentation">
            <button
                class="nav-link p-2 rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100 h-100"
                style="font-size: 0.9rem;" id="but-wordpress-tab" data-bs-toggle="pill" data-bs-target="#wordpress-tab"
                type="button" role="tab" aria-controls="wordpress-tab" aria-selected="false">
                <img draggable="false" src="img/svg/wordpress.svg" alt="Wordpress" width="16">
                <span style="line-height: normal;">Wordpress</span>
            </button>
        </li>
        <!-- Design Button -->
        <li class="nav-item w-100" role="presentation">
            <button
                class="nav-link p-2 rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100 h-100"
                style="font-size: 0.9rem;" id="but-design-tab" data-bs-toggle="pill" data-bs-target="#design-tab"
                type="button" role="tab" aria-controls="design-tab" aria-selected="false">
                <img draggable="false" src="img/svg/nib.svg" alt="Design" width="16">
                <span style="line-height: normal;">Design</span>
            </button>
        </li>
        <!-- Tools Button -->
        <li class="nav-item w-100" role="presentation">
            <button
                class="nav-link p-2 rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100 h-100"
                style="font-size: 0.9rem;" id="but-tools-tab" data-bs-toggle="pill" data-bs-target="#tools-tab"
                type="button" role="tab" aria-controls="tools-tab" aria-selected="false">
                <img draggable="false" src="img/svg/config.svg" alt="Ferramentas" width="16">
                <span style="line-height: normal;">Ferramentas</span>
            </button>
        </li>
        <!-- Design Mode -->
        <div class="form-check form-switch d-flex gap-1 align-items-center w-auto">
            <input class="form-check-input" type="checkbox" value="" id="checkDesignMode"
                style="transform: rotate(270deg);" switch>
        </div>
    </ul>

    <!-- Tabs -->
    <div class="main tab-content" id="pills-tabContent">

        <!-- Home tab -->
        <div class="main tab-pane fade w-100 show" id="initial-tab" role="tabpanel" aria-labelledby="but-initial-tab"
            tabindex="0">
            <div class="d-flex flex-row gap-3 p-4">

                <!-- Verse card -->
                <div class="verse-container rounded-4 p-4 w-100 enter-animation">
                    <div class="d-flex flex-row justify-content-between">
                        <div class="d-flex flex-row gap-2 align-items-center">
                            <img draggable="false" src="img/svg/cross.svg" alt="Cross" width="24" class="cross-icon">
                            <h4 class="fw-normal mb-0 mt-2 placeholder-glow"
                                style="font-family: 'Lavishly Yours', 'sans serif'; font-size: 2.8rem; color: var(--primary-200);"
                                id="bookVerse">
                                <span class="placeholder ms-2" style="width: 160px;"></span>
                            </h4>
                        </div>
                        <div class="d-flex flex-row gap-2 justify-content-between">
                            <h5 class="d-flex gap-2 align-items-center mb-0">
                                <span class="fw-semibold placeholder-glow row me-1" style="color: var(--primary-300);"
                                    id="numberVerse">
                                    <span class="placeholder" style="width: 6rem;"></span>
                                </span>
                                <span class="badge text-bg-primary"
                                    style="background-color: var(--transparency-60)!important"
                                    id="versionVerse">ARA</span>
                            </h5>
                        </div>
                    </div>
                    <!-- Verse Content + Placeholder -->
                    <p class="d-flex flex-row ms-3 placeholder-glow gap-2 row"
                        style="color: var(--primary-50); font-size: 1.125rem; padding: 2rem 1.8rem 1rem 0rem;"
                        id="contentVerse">
                        <span class="placeholder col-11"></span>
                        <span class="placeholder col-10"></span>
                        <span class="placeholder col-8"></span>
                    </p>
                    <!-- Invisible Content -->
                    <p class="d-none" id="contentToCopy"></p>
                    <p class="d-none" id="bibleChapterURL"></p>

                    <!-- Action Buttons -->
                    <div class="d-flex flex-row justify-content-end align-items-center">
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary copy-content" data-bs-toggle="tooltip"
                                data-bs-placement="top" data-bs-trigger="hover" title="Copiar versículo"
                                data-copy-selector="#contentToCopy">
                                <img draggable="false" style="pointer-events: none" width="16" src="img/svg/copy.svg"
                                    alt="Copy">
                            </button>
                            <button class="btn btn-outline-primary" data-bs-toggle="tooltip" data-bs-placement="top"
                                data-bs-trigger="hover" title="Abrir o capítulo completo"
                                data-open-url="#bibleChapterURL">
                                <img draggable="false" style="pointer-events: none" width="16" src="img/svg/open.svg"
                                    alt="Open">
                            </button>
                            <button class="btn btn-outline-primary" data-bs-toggle="tooltip" data-bs-placement="top"
                                data-bs-trigger="hover" title="Favoritar versículo" id="likeVerse">
                                <img draggable="false" style="pointer-events: none" width="16" src="img/svg/unlike.svg"
                                    alt="Like">
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Wordpress tab -->
        <div class="main tab-pane fade w-100" id="wordpress-tab" role="tabpanel" aria-labelledby="but-wordpress-tab"
            tabindex="0">
            <div class="d-flex flex-row gap-3">

                <!-- Lateral Nav Tabs -->
                <ul class="wordpressTab nav nav-tabs lateral-bar d-flex flex-column gap-1 mb-4 mt-5" id="pills-tab"
                    role="tablist" style="background: var(--transparency-30);">

                    <!-- Main WP Button -->
                    <li class="nav-item w-100" role="presentation">
                        <button style="font-size: 14px; padding: 0.5rem 0.8rem"
                            class="nav-link rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-start w-100 h-100"
                            style="font-size: 0.9rem;" id="but-main-wp-tab" data-bs-toggle="pill"
                            data-bs-target="#main-wp-tab" type="button" role="tab" aria-controls="main-wp-tab"
                            aria-selected="false">
                            <img draggable="false" src="img/svg/wordpress.svg" width="14" alt="Plugin">
                            <span style="line-height: normal;">Recursos</span>
                        </button>
                    </li>

                    <!-- Plugins Button -->
                    <li class="nav-item w-100" role="presentation">
                        <button style="font-size: 14px; padding: 0.5rem 0.8rem"
                            class="nav-link rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-start w-100 h-100"
                            style="font-size: 0.9rem;" id="but-plugins-tab" data-bs-toggle="pill"
                            data-bs-target="#plugins-tab" type="button" role="tab" aria-controls="plugins-tab"
                            aria-selected="false">
                            <img draggable="false" src="img/svg/plugin.svg" width="14" alt="Plugin">
                            <span style="line-height: normal;">Plugins</span>
                        </button>
                    </li>

                    <!-- Redirection Button -->
                    <li class="nav-item w-100" role="presentation">
                        <button style="font-size: 14px; padding: 0.5rem 0.8rem"
                            class="nav-link rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-start w-100 h-100"
                            style="font-size: 0.9rem;" id="but-redirection-tab" data-bs-toggle="pill"
                            data-bs-target="#redirection-tab" type="button" role="tab" aria-controls="redirection-tab"
                            aria-selected="false">
                            <img draggable="false" src="img/svg/redirect.svg" width="14" alt="Redirect">
                            <span style="line-height: normal;">Redirect</span>
                        </button>
                    </li>
                </ul>

                <!-- Content -->
                <div class="main tab-content gap-3 p-4 d-flex w-100">

                    <!-- Main WP Tab -->
                    <div class="main tab-pane fade w-100" id="main-wp-tab" role="tabpanel"
                        aria-labelledby="but-main-wp-tab" tabindex="0">
                        <div
                            class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none mb-3">
                            <label for="url_"
                                class="text-white fw-semibold fs-5 user-select-none d-flex align-items-center gap-1">
                                <img draggable="false" src="img/svg/wordpress.svg" width="24" alt="Wordpress">Recursos do
                                Wordpress</label>
                        </div>
                        <div class="d-flex gap-3 p-4 w-100 rounded-2 enter-animation flex-column"
                            style="background: var(--transparency-10); border: 1px solid var(--primary-900);">
                            <div class="d-flex gap-3 w-100 rounded-2 enter-animation flex-row justify-content-around align-items-center p-4"
                                style="background-color: var(--transparency-10); border: 1px solid var(--transparency-20);">
                                <label
                                    class="text-white fw-normal fs-6 user-select-none d-flex flex-column text-nowrap">
                                    Realizar o download do Wordpress
                                    <span style="opacity: 0.4; font-size: 0.8rem;">
                                        Ferramenta de criação de <i>websites</i>
                                    </span>
                                </label>
                                <div class="d-flex flex-row gap-2 w-auto justify-content-center">
                                    <button
                                        class="btn btn-primary rounded-3 fw-normal d-flex flex-row align-items-center gap-1 py-2 px-5 user-select-none justify-content-center"
                                        data-open-url="#downloadWordpress">
                                        <img src="img/svg/download.svg" alt="Download" width="16"
                                            style="margin: 2px 0 0 -2px;">
                                        Download
                                    </button>
                                    <p class="d-none" id="downloadWordpress">https://wordpress.org/latest.zip</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Plugins Tab -->
                    <div class="main tab-pane fade w-100" id="plugins-tab" role="tabpanel"
                        aria-labelledby="but-plugins-tab" tabindex="0">
                        <div
                            class="main d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none mb-3">
                            <label for="url_"
                                class="text-white fw-semibold fs-5 user-select-none d-flex align-items-center gap-1">
                                <img draggable="false" src="img/svg/plugin.svg" width="20" style="margin-top: 1px;"
                                    alt="Download">Plugins
                                para Website</label>
                        </div>
                        <div class="gap-3 d-flex flex-column justify-content-between text-center pe-3 w-100"
                            style="max-height: 400px;overflow-y: auto;overflow-x: hidden;">

                            <!-- Plugin Card Template -->
                            <div id="card-container" class="d-flex flex-column gap-3 enter-animation"></div>
                        </div>
                    </div>

                    <!-- Redirection Tab -->
                    <div class="main tab-pane fade w-100" id="redirection-tab" role="tabpanel"
                        aria-labelledby="but-redirection-tab" tabindex="0">
                        <div
                            class="main d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none mb-3">
                            <label for="url_"
                                class="text-white fw-semibold fs-5 user-select-none d-flex align-items-center gap-1">
                                <img draggable="false" src="img/svg/redirect.svg" width="20" style="margin-top: 1px;"
                                    alt="Download">Redirect de Páginas</label>
                        </div>
                        <div class="d-flex flex-column gap-3 enter-animation">
                            <div
                                class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none mb-3">
                                <label for="url_"
                                    class="text-white fw-semibold fs-6 user-select-none d-flex align-items-center gap-1">
                                    <img draggable="false" width="24" src="img/svg/link.svg" style="margin-top: 1px"
                                        alt="Link">URL
                                    Original</label>
                                <input type="text" class="form-control font-whitep-2 w-75 bg-transparent border-0"
                                    id="url_" data-bs-toggle="tooltip" data-bs-placement="bottom"
                                    title="URL original da página" disabled>
                            </div>
                            <form action="#" method="get"
                                class="d-flex flex-row flex-wrap gap-3 w-100 justify-content-center ali">
                                <div
                                    class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none">
                                    <label for="url_domain"
                                        class="text-white fw-semibold fs-6 user-select-none">Domínio</label>
                                    <input type="text" class="form-control font-whitep-2 w-75" id="url_domain"
                                        data-bs-toggle="tooltip" data-bs-placement="top" data-bs-trigger="focus"
                                        title="Ex: https://domínio.com/" autocomplete="off">
                                </div>
                                <div
                                    class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none">
                                    <label for="inputUrl" class="text-white fw-semibold fs-6 user-select-none">Slug
                                        Antigo</label>
                                    <input type="text" class="form-control font-whitep-2 w-75 " id="inputUrl"
                                        data-bs-toggle="tooltip" data-bs-placement="top" data-bs-trigger="focus"
                                        title="Ex: https://domínio.com/slug-antigo/" autocomplete="off">
                                </div>
                                <div
                                    class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none helpers">
                                    <label for="outputUrl" class="text-white fw-semibold fs-6 user-select-none">Slug
                                        Destino</label>
                                    <input type="text" class="form-control font-whitep-2 w-75" id="outputUrl"
                                        data-bs-toggle="tooltip" data-bs-placement="top" data-bs-trigger="focus"
                                        title="Ex https://domínio.com/slug-destino/" autocomplete="off">
                                </div>
                                <button id="redirectBtn" type="submit"
                                    class="btn btn-primary user-select-none text-center w-100 fw-semibold fs-6">Criar
                                    Redirect</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Design tab -->
        <div class="main tab-pane fade w-100" id="design-tab" role="tabpanel" aria-labelledby="but-design-tab"
            tabindex="0">
            <div class="main d-flex flex-row">

            </div>
        </div>

        <!-- Tools tab -->
        <div class="main tab-pane fade w-100" id="tools-tab" role="tabpanel" aria-labelledby="but-tools-tab"
            tabindex="0">
            <div class="d-flex flex-row gap-3">
                <!-- Lateral Nav Tabs -->
                <ul class="settingsTab nav nav-tabs lateral-bar d-flex flex-column gap-1 mb-4 mt-5" id="pills-tab"
                    role="tablist" style="background: var(--transparency-30);">

                    <!-- Note Block Button -->
                    <li class="nav-item w-100" role="presentation">
                        <button style="font-size: 14px; padding: 0.5rem 0.8rem"
                            class="nav-link rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-start w-100 h-100"
                            style="font-size: 0.9rem;" id="but-note-tab" data-bs-toggle="pill"
                            data-bs-target="#note-tab" type="button" role="tab" aria-controls="note-tab"
                            aria-selected="false">
                            <img draggable="false" src="img/svg/note.svg" width="14" alt="Anotações">Anotações</button>
                    </li>

                    <!-- Mask and Validation Code Button -->
                    <li class="nav-item w-100" role="presentation">
                        <button style="font-size: 14px; padding: 0.5rem 0.8rem"
                            class="nav-link rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-start w-100 h-100"
                            style="font-size: 0.9rem;" id="but-form-mask-validation-tab" data-bs-toggle="pill"
                            data-bs-target="#form-mask-validation-tab" type="button" role="tab"
                            aria-controls="form-mask-validation-tab" aria-selected="false">
                            <img draggable="false" src="img/svg/form.svg" width="16" alt="E-mail">Formulário</button>
                    </li>

                    <!-- Advanced Tools Button -->
                    <li class="nav-item w-100" role="presentation">
                        <button style="font-size: 14px; padding: 0.5rem 0.8rem"
                            class="nav-link rounded-3 bg-transparent fw-normal d-flex flex-row align-items-center gap-1 user-select-none justify-content-start w-100 h-100"
                            style="font-size: 0.9rem;" id="but-advanced-settings-tab" data-bs-toggle="pill"
                            data-bs-target="#advanced-settings-tab" type="button" role="tab"
                            aria-controls="advanced-settings-tab" aria-selected="false">
                            <img draggable="false" src="img/svg/magic.svg" width="16" alt="Avançado">Avançado</button>
                    </li>
                </ul>

                <div class="main tab-content gap-3 p-4 d-flex w-100">

                    <!-- Note Block Tab -->
                    <div class="main tab-pane fade w-100 enter-animation" id="note-tab" role="tabpanel"
                        aria-labelledby="but-note-tab" tabindex="0" style="min-height: 350px;">

                        <div
                            class="d-flex flex-row gap-3 justify-content-between align-items-center user-select-none mb-3">
                            <label class="text-white fw-semibold fs-5 d-flex align-items-center gap-1">
                                <img draggable="false" src="img/svg/note.svg" width="22" alt="Anotações">Anotações
                            </label>
                            <div class="d-flex flex-row gap-2 w-100">
                                <input type="text" class="form-control search-input w-100" style="height: 2.4rem;"
                                    id="searchInput" placeholder="Buscar anotação">
                                <button class="btn btn-primary" style="height: 2.4rem;" data-bs-toggle="modal"
                                    data-bs-target="#noteModal">
                                    <img src="img/svg/new-note.svg" width="16" alt="New Note">
                                </button>
                                <button class="btn btn-primary" style="height: 2.4rem;" data-open-url="#noteBlockPage" data-bs-toggle="modal">
                                    <img src="img/svg/open.svg" width="16" alt="New Note">
                                </button>
                                <p class="d-none" id="noteBlockPage">/notes.html</p>
                            </div>
                        </div>

                        <div class="mb-2 d-flex gap-3 flex-column enter-animation">
                            <div class="notes-container d-flex flex-column gap-2 h-100"
                                style="max-height: 300px; overflow-y: auto; overflow-x: hidden;" id="notesList">
                                <div class="empty-state" id="emptyState"></div>
                            </div>
                        </div>

                        <!-- Modal -->
                        <div class="modal fade" id="noteModal" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header d-flex flex-row align-items-center">
                                        <h5 class="modal-title me-2" id="modalContent">Anotações</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="mb-2">
                                            <input type="text" class="form-control mb-2" id="noteTitle"
                                                placeholder="Título" required autocomplete="off">
                                            <textarea class="form-control" id="noteContent" rows="5"
                                                style="height: 162px; min-height: 162px; max-height: 162px; overflow-y: auto; overflow-x: hidden;"
                                                placeholder="Conteúdo" required autocomplete="off"></textarea>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"
                                            style="padding: 0.6rem 1.4rem!important;">Cancelar</button>
                                        <button type="button" class="btn btn-primary btn-sm" id="saveNote"
                                            style="padding: 0.6rem 1.4rem!important;">Salvar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Mask and Validation Code Tab -->
                    <div class="main tab-pane fade w-100" id="form-mask-validation-tab" role="tabpanel"
                        aria-labelledby="but-form-mask-validation-tab" tabindex="0">
                        <div
                            class="main d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none mb-3">
                            <label for="url_"
                                class="text-white fw-semibold fs-5 user-select-none d-flex align-items-center gap-1">
                                <img draggable="false" src="img/svg/form.svg" width="24" alt="E-mail">Máscara e Validação de
                                Campo</label>
                        </div>
                        <div class="d-flex flex-column justify-content-between w-100 p-3 gap-3 rounded-3"
                            style="max-height: 260px;overflow-y: auto;overflow-x: hidden; background-color: var(--transparency-10); border: 1px solid var(--primary-950);">
                            <!-- E-mail validation -->
                            <div class="d-flex gap-3 w-100 rounded-2 enter-animation flex-column">
                                <label class="text-white fw-normal fs-6 user-select-none">
                                    Validação de e-mail corporativo <span style="opacity: 0.4; font-size: 0.8rem;">Ex:
                                        @gmail.com, @hotmail.com...</span>
                                </label>
                                <div class="d-flex flex-row w-100">
                                    <span
                                        class="d-flex flex-column align-items-center justify-content-center px-3 py-1 text-nowrap text-white"
                                        style="background: linear-gradient(90deg, var(--transparency-70) 0%, var(--transparency-90) 50%); border-radius: 0.4rem 0rem 0 0.4rem;">
                                        Nome do campo
                                    </span>
                                    <input class="form-control" type="text" id="emailField" placeholder="email"
                                        style="border-radius: 0 0.4rem 0.4rem 0; box-shadow: initial;" />
                                    <button class="btn btn-primary ms-2" id="copyEmailValidation">
                                        <img src="img/svg/copy.svg" width="18">
                                    </button>
                                </div>
                            </div>
                            <!-- Phone mask -->
                            <div class="d-flex gap-3 w-100 rounded-2 enter-animation flex-column">
                                <label class="text-white fw-normal fs-6 user-select-none">
                                    Máscara para telefone <span style="opacity: 0.4; font-size: 0.8rem;">Ex: (00)
                                        00000-0000</span>
                                </label>
                                <div class="d-flex flex-row w-100">
                                    <span
                                        class="d-flex flex-column align-items-center justify-content-center px-3 py-1 text-nowrap text-white"
                                        style="background: linear-gradient(90deg, var(--transparency-70) 0%, var(--transparency-90) 50%); border-radius: 0.4rem 0rem 0 0.4rem;">
                                        Nome do campo
                                    </span>
                                    <input class="form-control" type="text" id="phoneField" placeholder="phone"
                                        style="border-radius: 0 0.4rem 0.4rem 0; box-shadow: initial;" />
                                    <button class="btn btn-primary ms-2" id="copyPhoneMask">
                                        <img src="img/svg/copy.svg" width="18">
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Advanced Tools Tab -->
                    <div class="main tab-pane fade w-100" id="advanced-settings-tab" role="tabpanel"
                        aria-labelledby="but-advanced-settings-tab" tabindex="0">
                        <div
                            class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none mb-3">
                            <label for="url_"
                                class="text-white fw-semibold fs-5 user-select-none d-flex align-items-center gap-1">
                                <img draggable="false" src="img/svg/magic.svg" width="24" alt="Download">Avançado</label>
                        </div>
                        <div class="d-flex gap-3 p-4 w-100 rounded-2 enter-animation flex-column"
                            style="background: var(--transparency-10); border: 1px solid var(--primary-900);">
                            <div class="d-flex gap-3 w-100 rounded-2 enter-animation flex-row justify-content-around align-items-center p-4"
                                style="background-color: var(--transparency-10); border: 1px solid var(--transparency-20);">
                                <label
                                    class="text-white fw-normal fs-6 user-select-none d-flex flex-column text-nowrap">
                                    Ativar modo designer na página
                                    <span style="opacity: 0.4; font-size: 0.8rem;">
                                        Desfazer alterações: <i>Ctrl + Z</i> ou <i>F5</i>
                                    </span>
                                </label>
                                <div class="d-flex flex-row gap-2 w-auto justify-content-center"
                                    data-bs-toggle="tooltip" data-bs-placement="top" data-bs-trigger="hover"
                                    title="Permite vizualizar alterações no conteúdo da página.">
                                    <button
                                        class="btn btn-outline-primary rounded-3 fw-normal d-flex flex-row align-items-center gap-1 py-2 px-5 user-select-none justify-content-center"
                                        id="designModeTool"
                                        style="background-color: var(--transparency-30); transform: none;">
                                        <img src="img/svg/nib.svg" alt="Nib" width="16" style="margin-top: 2px;">
                                        Design Mode
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
