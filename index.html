<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/symbols.css">
</head>

<body>
    <!-- Nabegation bar -->
    <div class="nav-bar">
        <button id="initialButton" class="button-style-1 tab-button"><span class="material-symbols-outlined">home</span>Inicial</button>
        <button id="redirectionButton" class="button-style-1 tab-button"><span class="material-symbols-outlined">open_in_new</span>Redirection</button>
    </div>

    <!-- Default tab -->
     <div id="initial-tab" class="tab">
        <div class="default-tab">
            <div class="default-tab-header">
                <h1 style="color: white;">Seja bem-vindo ao Nexus</h1>
                <p style="color: white;">Escolha uma das opções acima para começar</p>
            </div>
        </div>
     </div>

    <!-- Redirection -->
    <div id="redirection-tab" class="tab">
        <div class="redirect-resources">
            <form action="#" method="get" class="div-standard">
                <div class="lbl-cont">
                    <label for="" class="label-input">Domínio</label>
                    <input type="text" class="input-url" id="url_domain">
                </div>
                <div class="lbl-cont">
                    <label for="" class="label-input">Slug de origem</label>
                    <input type="text" class="input-url" id="inputUrl">
                </div>
                <div class="lbl-cont helpers">
                    <label for="" class="label-input">Slug destino</label>
                    <input type="text" class="input-url" id="outputUrl">
                </div>

                <div class="lbl-cont">
                    <label for="" class="label-input">URL original</label>
                    <input type="text" class="input-url" id="url_">
                </div>
                <button id="redirectBtn" type="submit" class="button-style-2">Criar redirect</button>
            </form>
            <div class="options">
                <button id="redirectInstallBtn" type="submit" class="button-style-2">Instalar Redirection</button>
                <button class="button-style-2">Parâmetros de consulta</button>
                <button class="button-style-2">Corresponder</button>
                <button class="button-style-2">Quando corresponder</button>
                <button class="button-style-2">Código HTTP</button>
            </div>
        </div>
    </div>
    <script src="js/popup.js"></script>
    <script src="js/storage.js"></script>
</body>

</html>
