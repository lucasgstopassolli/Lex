<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/tabs.css">
    <link rel="stylesheet" href="css/symbols.css">
    <link rel="stylesheet" href="css/colorPicker.css">
    <link rel="stylesheet" href="css/contrastChecker.css">
    <link rel="stylesheet" href="css/default.css">

</head>

<body>
    <!-- Nabegation bar -->
    <div id="navBar" class="nav-bar">
        <button id="initialButton" class="button-style-1 tab-button active"><span
                class="material-symbols-outlined">home</span>Home</button>
        <button id="pluginsButton" class="button-style-1 tab-button"><span
                class="material-symbols-outlined">extension</span>Plugins</button>
        <button id="redirectionButton" class="button-style-1 tab-button"><span
                class="material-symbols-outlined">open_in_new</span>Redirection</button>
        <button id="toolsButton" class="button-style-1 tab-button"><span
                class="material-symbols-outlined">widgets</span>Tools</button>
    </div>

    <!-- Default tab -->
    <div id="initial-tab" class="tab active">
        <div class="ressources">
            <form action="#" method="get">
                <select class="input-default" name="" id="">
                    <option value="">Select a tab</option>
                    <option value="initial-tab">Home tab</option>
                    <option value="plugins-tab">Plugins tab</option>
                    <option value="redirection-tab">Redirection tab</option>
                    <option value="tools-tab">Tools tab</option>
                </select>
                <button id="defaultTabBtn" type="submit" class="button-style-2">Set the default tab</button>
            </form>
        </div>
    </div>

    <!-- Plugins tab -->
    <div id="plugins-tab" class="tab">
        <div class="ressources">
            <div class="default-tab-header">
                <h1 style="color: white;">Plugins (essential)</h1>
                <button id="redirectInstallBtn" type="submit" class="button-style-2">Install
                    <i>Redirection</i></button>
                <button id="backupInstallBtn" type="submit" class="button-style-2">Install <i>All-in-One WP
                        Migration and Backup</i></button>
                <button id="replaceImageBtn" type="submit" class="button-style-2">Install <i>Enable Media
                        Replace</i></button>
            </div>
            <div class="default-tab-header">
                <h1 style="color: white;">Plugins (blog)</h1>
                <button id="loginPressInstallBtn" type="submit" class="button-style-2">Install <i>LoginPress |
                        Custom Login Page Customizer</i></button>
                <button id="#" type="submit" class="button-style-2">Install <i>Example</i></button>
                <button id="#" type="submit" class="button-style-2">Install <i>Example</i></button>
            </div>
        </div>
    </div>

    <!-- Redirection tab -->
    <div id="redirection-tab" class="tab">
        <div class="ressources">
            
            <form action="#" method="get">
                <div class="lbl-cont">
                    <label for="" class="label-input">Domain</label>
                    <input type="text" class="input-default" id="url_domain">
                </div>
                <div class="lbl-cont">
                    <label for="" class="label-input">Source Slug</label>
                    <input type="text" class="input-default" id="inputUrl">
                </div>
                <div class="lbl-cont helpers">
                    <label for="" class="label-input">Destination Slug</label>
                    <input type="text" class="input-default" id="outputUrl">
                </div>
                <div class="lbl-cont">
                    <label for="" class="label-input">Original URL</label>
                    <input type="text" class="input-default" id="url_">
                </div>
                <button id="redirectBtn" type="submit" class="button-style-2">Create Redirect</button>
            </form>
            <div class="lbl-cont helpers">
                <label for="" class="label-input">Nonce</label>
                <input type="text" class="input-default" id="nonceValue" readonly>
            </div>
        </div>
    </div>

    <!-- Tools tab -->
    <div id="tools-tab" class="tab">
        <div class="ressources">
            <div class="lateral-bar" width="20%">
                <button id="colorPickerLateralButton" class="button-style-1 side-tab-button active"><span
                        class="material-symbols-outlined">palette</span>Color Picker</button>
                <button id="test1LateralButton" class="button-style-1 side-tab-button"><span
                        class="material-symbols-outlined">contrast</span>Color Constrast</button>
                <button id="test2LateralButton" class="button-style-1 side-tab-button"><span
                        class="material-symbols-outlined">gradient</span>Gradient</button>
            </div>
            <div class="side-tab tab active" id="tab-1" style="color: white;">
                <div class="ressources">
                    <div class="color-picker">
                        <canvas id="color-picker"></canvas>
                    </div>
                    <div class="color-picker-ressources">
                        <div class="color-area">
                            <label for="color" class="label-input">RGB</label>
                            <input class="input-default input-color" id="color"></input>
                            <button class="button-style-3" id="butCopyRGB" style="background: #381f1c;"><span
                                    class="material-symbols-outlined">content_copy</span></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="side-tab tab" id="tab-2">
                <!-- Test -->
                <div class="main-container">
                    <div class="color-sections-wrapper">
                        <div class="color-section" id="foreground-section">
                            <h2>Primeiro plano</h2>
                            <label for="fgHex">Valor hexadecimal</label>
                            <input type="text" id="fgHex" value="#0000FF" maxlength="7">

                            <div class="input-group">
                                <label for="fgColor" class="sr-only">Seletor de cores</label>
                                <input type="color" id="fgColor" value="#0000FF">
                                <label for="fgAlpha">Alfa</label>
                                <input type="number" id="fgAlpha" value="1" min="0" max="1" step="0.01">
                            </div>

                            <label for="fgLightness">Leveza</label>
                            <input type="range" id="fgLightness" min="0" max="100" value="50">
                        </div>

                        <div class="color-section" id="background-section">
                            <h2>Fundo</h2>
                            <label for="bgHex">Valor hexadecimal</label>
                            <input type="text" id="bgHex" value="#FFFFFF" maxlength="7">

                            <div class="input-group">
                                <label for="bgColor" class="sr-only">Seletor de cores</label>
                                <input type="color" id="bgColor" value="#FFFFFF">
                                <label for="bgAlpha">Alfa</label>
                                <input type="number" id="bgAlpha" value="1" min="0" max="1" step="0.01">
                            </div>

                            <label for="bgLightness">Leveza</label>
                            <input type="range" id="bgLightness" min="0" max="100" value="100">
                        </div>
                    </div>

                    <div class="contrast-result-section">
                        <p>Taxa de contraste</p>
                        <div id="contrastRatioDisplay" class="ratio-display">
                            <span id="contrastRatioValue">-- : 1</span>
                        </div>
                    </div>

                    <div id="wcag-compliance">
                        <h3>WCAG AA:</h3>
                        <p>Texto Normal (>= 4.5:1): <span id="wcagAA">--</span></p>
                        <p>Texto Grande (>= 3:1): <span id="wcagAALarge">--</span></p>
                        <h3>WCAG AAA:</h3>
                        <p>Texto Normal (>= 7:1): <span id="wcagAAA">--</span></p>
                        <p>Texto Grande (>= 4.5:1): <span id="wcagAAALarge">--</span></p>
                    </div>
                </div>

            </div>
            <div class="side-tab tab" id="tab-3">
                teste3
            </div>
        </div>

        <script src="js/objects.js"></script>
        <script src="js/redirection.js"></script>
        <script src="js/popup.js"></script>
        <script src="js/html5kellycolorpicker.min.js"></script>
        <script src="js/colorPicker.js"></script>
        <script src="js/contrastChecker.js"></script>
        <script src="js/global.js"></script>
        <script src="js/storage.js"></script>
</body>

</html>
