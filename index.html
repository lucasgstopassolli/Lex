<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/symbols.css">
    <link rel="stylesheet" href="css/colorPicker.css">
    <link rel="stylesheet" href="css/contrastChecker.css">
    <link rel="stylesheet" href="css/default.css">
</head>

<body class="margin-0 d-flex flex-column">

    <!-- Nav Tabs -->
    <ul class="nav nav-pills d-flex flex-row gap-0 p-1 mb-1 flex-nowrap nav-bar mainTab" id="pills-tab" role="tablist">

        <!-- Home Button -->
        <li class="nav-item w-100" role="presentation">
            <button
                class="nav-link p-2 rounded-3 bg-transparent fw-bold fs-6 d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100"
                id="but-initial-tab" data-bs-toggle="pill" data-bs-target="#initial-tab" type="button" role="tab"
                aria-controls="initial-tab" aria-selected="true">
                <img src="svg/home.svg" alt="Home">Home
            </button>
        </li>

        <!-- Wordpress Button -->
        <li class="nav-item w-100" role="presentation">
            <button
                class="nav-link p-2 rounded-3 bg-transparent fw-bold fs-6 d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100"
                id="but-wordpress-tab" data-bs-toggle="pill" data-bs-target="#wordpress-tab" type="button" role="tab"
                aria-controls="wordpress-tab" aria-selected="false">
                <img src="svg/wordpress.svg" alt="Wordpress">Wordpress
            </button>
        </li>

        <!-- Design Button -->
        <li class="nav-item w-100" role="presentation">
            <button
                class="nav-link p-2 rounded-3 bg-transparent fw-bold fs-6 d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100"
                id="but-design-tab" data-bs-toggle="pill" data-bs-target="#design-tab" type="button" role="tab"
                aria-controls="design-tab" aria-selected="false">
                <img src="svg/color-pallete.svg" alt="Design">Design
            </button>
        </li>
    </ul>

    <!-- Tabs -->
    <div class="tab-content" id="pills-tabContent">

        <!-- Home tab -->
        <div class="tab-pane fade show" id="initial-tab" role="tabpanel" aria-labelledby="but-initial-tab" tabindex="0">
            <div class="gap-3 p-3 d-flex flex-row justify-content-between text-center">
                <input type="text" class="form-control font-whitep-2">
            </div>
        </div>

        <!-- Wordpress tab -->
        <div class="tab-pane fade" id="wordpress-tab" role="tabpanel" aria-labelledby="but-wordpress-tab" tabindex="0">
            <div class="d-flex flex-row">
                <!-- Nav Tabs -->
                <ul class="nav nav-tabs lateral-bar w-25 d-flex flex-column gap-3 p-2 w-25 mb-0 rounded-3 wordpressTab" id="pills-tab" role="tablist">

                    <!-- Plugins Button -->
                    <li class="nav-item w-100" role="presentation">
                        <button
                            class="nav-link p-2 rounded-3 bg-transparent fw-bold fs-6 d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100"
                            id="but-plugins-tab" data-bs-toggle="pill" data-bs-target="#plugins-tab" type="button"
                            role="tab" aria-controls="plugins-tab" aria-selected="false">
                            <img src="svg/plugin.svg" alt="Plugin">Plugins</button>
                    </li>

                    <!-- Redirection Button -->
                    <li class="nav-item w-100" role="presentation">
                        <button
                            class="nav-link p-2 rounded-3 bg-transparent fw-bold fs-6 d-flex flex-row align-items-center gap-1 user-select-none justify-content-center w-100"
                            id="but-redirection-tab" data-bs-toggle="pill" data-bs-target="#redirection-tab"
                            type="button" role="tab" aria-controls="redirection-tab" aria-selected="false">
                            <img src="svg/redirect.svg" alt="Redirect">Redirect</button>
                    </li>
                </ul>
                <!-- Content -->
                <div class="tab-content gap-3 p-3 d-flex w-100">
                    <!-- Plugins Tab -->
                    <div class="tab-pane fade" id="plugins-tab" role="tabpanel" aria-labelledby="but-plugins-tab"
                        tabindex="0">
                        <div class="gap-3 d-flex flex-row justify-content-between text-center">
                            <div class="d-flex flex-column gap-3 w-100">
                                <button id="redirectInstallBtn" type="submit"
                                    class="btn btn-primary user-select-none text-center">Install
                                    <i>Redirection</i></button>
                                <button id="backupInstallBtn" type="submit"
                                    class="btn btn-primary user-select-none text-center">Install <i>All-in-One WP
                                        Migration and Backup</i></button>
                                <button id="replaceImageBtn" type="submit"
                                    class="btn btn-primary user-select-none text-center">Install <i>Enable Media
                                        Replace</i></button>
                            </div>
                            <div class="d-flex flex-column gap-3 w-100">
                                <button id="loginPressInstallBtn" type="submit"
                                    class="btn btn-primary user-select-none text-center">Install <i>LoginPress |
                                        Custom Login Page Customizer</i></button>
                                <button id="#" type="submit"
                                    class="btn btn-primary user-select-none text-center">Install
                                    <i>Example</i></button>
                                <button id="#" type="submit"
                                    class="btn btn-primary user-select-none text-center">Install
                                    <i>Example</i></button>
                            </div>
                        </div>
                    </div>
                    <!-- Redirection Tab -->
                    <div class="tab-pane fade" id="redirection-tab" role="tabpanel"
                        aria-labelledby="but-redirection-tab" tabindex="0">
                        <div class="d-flex flex-column gap-3">
                            <div
                                class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none mb-3">
                                <label for="url_"
                                    class="text-white fw-bold fs-6 user-select-none d-flex align-items-center gap-1">
                                    <img src="svg/link.svg" style="margin-top: 1px" alt="Link">Original URL</label>
                                <input type="text" class="form-control font-whitep-2 w-75 bg-transparent border-0"
                                    id="url_" disabled>
                            </div>
                            <form action="#" method="get"
                                class="d-flex flex-row flex-wrap gap-3 w-100 justify-content-center ali">
                                <div
                                    class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none">
                                    <label for="url_domain"
                                        class="text-white fw-bold fs-6 user-select-none">Domain</label>
                                    <input type="text" class="form-control font-whitep-2 w-75" id="url_domain">
                                </div>
                                <div
                                    class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none">
                                    <label for="inputUrl" class="text-white fw-bold fs-6 user-select-none">Slug Antigo</label>
                                    <input type="text" class="form-control font-whitep-2 w-75 " id="inputUrl">
                                </div>
                                <div
                                    class="d-flex flex-row gap-3 w-100 justify-content-between align-items-center user-select-none helpers">
                                    <label for="outputUrl" class="text-white fw-bold fs-6 user-select-none">Slug Destino</label>
                                    <input type="text" class="form-control font-whitep-2 w-75" id="outputUrl">
                                </div>
                                <button id="redirectBtn" type="submit"
                                    class="btn btn-primary user-select-none text-center w-100">Create Redirect</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Design tab -->
        <div class="tab-pane fade" id="design-tab" role="tabpanel" aria-labelledby="but-design-tab" tabindex="0">
            <div class="gap-3 p-3 d-flex">

            </div>
        </div>

        <!-- Scripts -->
        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/objects.js"></script>
        <script src="js/redirection.js"></script>
        <script src="js/popup.js"></script>
        <script src="js/colorPicker.js"></script>
        <script src="js/contrastChecker.js"></script>
        <script src="js/global.js"></script>
        <script src="js/storage.js"></script>
</body>

</html>
