<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" spellcheck="false">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloco de Anotações - Lex</title>
  <!-- Google Fonts & Icons-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Sedgwick+Ave&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- Styles and Bootstrap -->
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <script src="js/librarys/bootstrap/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/default.css" />
  <link rel="stylesheet" href="css/note-block.css" />
  <link rel="stylesheet" href="css/quill.snow.css" />
  <link rel="icon" type="image" href="img/512.png" />
  <!-- Another librarys -->
  <script src="js/librarys/purify/purify.min.js"></script>
</head>

<body id="notePage">
  <div class="container" style="padding-top: 5vw">
    <div class="mb-5 d-flex flex-row align-items-center justify-content-center gap-3">
      <img class="user-select-none" src="img/svg/lex-note-logo.svg" alt="Lex Icon"
        style="width: 6rem; margin-right: -0.9rem;" />
      <h1 class="title user-select-none mb-0 fw-bold">Lex Note</h1>
    </div>

    <div class="row justify-content-center">
      <div class="d-flex flex-row align-items-center justify-content-center gap-2 w-75 user-select-none mb-3">
        <input type="text" class="form-control search-input w-100" id="searchInput" placeholder="Buscar anotação" />
        <button class="btn btn-primary" style="height: 3.2rem; width: 3.4rem" data-bs-toggle="modal"
          data-bs-target="#noteModal">
          <img src="https://api.iconify.design/ri:sticky-note-add-fill.svg?color=%23ffffff" width="21" alt="New Note" />
        </button>
      </div>
    </div>

    <div class="row">
      <div class="d-flex gap-3 flex-column align-items-center enter-animation mb-5">
        <div class="row notes-container h-auto g-3 w-75" id="notesList">
          <div class="empty-state" id="emptyState"></div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="noteModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
          <div class="modal-header d-flex flex-row align-items-center">
            <h5 class="modal-title" id="modalContent">Anotações</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
              <input type="text" class="form-control mb-3" id="noteTitle" placeholder="Título" required
                autocomplete="off" style="height: 2.8rem" />
              <div id="editor"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"
              style="padding: 0.6rem 1.4rem !important">
              Cancelar
            </button>
            <button type="button" class="btn btn-primary btn-sm" id="saveNote"
              style="padding: 0.6rem 1.4rem !important">
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/librarys/quill/quill.min.js"></script>
  <script src="js/utils/template.js"></script>
  <script src="js/utils/global.js"></script>
  <script type="module" src="js/tools/note-block/main.js"></script>
</body>

</html>
